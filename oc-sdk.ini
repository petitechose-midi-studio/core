; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.11

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#526f885af007dff32615af8bf8ab915127235d5e
    oc-note=https://github.com/open-control/note.git#4c6c33ad7bedf439b57eac85c796e9d922c54b32
    oc-hal-common=https://github.com/open-control/hal-common.git#4ead7b65eb5bfa5af4036b96fe53bb6bc0ca24f7
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#df9357956890871e1322ced85cd19fb249f3533f
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#4bab2f0ddf90ae20909e4befaaec352b254b4a10
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#30bd0fc972d3b724066a3fcd243e2440fbb32615
