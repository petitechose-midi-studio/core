; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.2

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#95c6bd2743d6029dabbe5d1cd65e76b2890a60d7
    oc-note=https://github.com/open-control/note.git#555d772d4892d7942d8aff3bf3361073566e25cd
    oc-hal-common=https://github.com/open-control/hal-common.git#4ead7b65eb5bfa5af4036b96fe53bb6bc0ca24f7
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#949438debef900cc02f59e3d1c0d983e68ba1f25
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#134b275551c0ce88e442e78447af1cddb654b546
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#303abe2968ab9c1ce8b4c189fbbea706d5b44353
