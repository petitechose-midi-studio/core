; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.41

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#24037dcee919f955cb3626b92853fd963ead87aa
    oc-note=https://github.com/open-control/note.git#23e8ed882b10640b1bab4a17d165196511fa6fbc
    oc-hal-common=https://github.com/open-control/hal-common.git#5567103c878e3c9e5be8929d1301a15b4bfa02aa
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#617769b086b385aa3a035611e217efda3144eb57
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#4d6276976b7db31f4af0b3dd6ffc8c8589cb6dba
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#5bad36e8a81237bd5ab25c277c9f27ebb6735066
