; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.28

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#766eb23b377243f8158197f5f6676276955273a2
    oc-note=https://github.com/open-control/note.git#ecd904387b685573fc29dd2f8f031f21c713b860
    oc-hal-common=https://github.com/open-control/hal-common.git#4ead7b65eb5bfa5af4036b96fe53bb6bc0ca24f7
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#b9e169d03b756f5383de6ed448bf5ccb94cbc12f
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#3dcf037507c0bf9e596e7daf240f7df6309af6fb
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#b40208f1d3b6038e9ef0275b5a0f360fcb9ebf04
