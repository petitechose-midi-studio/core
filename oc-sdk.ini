; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.25

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#153e477619b7fd93efaeaccd40a00704f82eb97f
    oc-note=https://github.com/open-control/note.git#bdfc01dad1d9751d4a9870cd03d8466e49040b8d
    oc-hal-common=https://github.com/open-control/hal-common.git#4ead7b65eb5bfa5af4036b96fe53bb6bc0ca24f7
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#8b71a8b110fb0f3d100edee3afe154bae705581d
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#e58d227a06cb191337b51e05774fb96cd6fd5dc1
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#4bb5b0ad8ebb608a5d8623245f12fc2aa8b8635c
