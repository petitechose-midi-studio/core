; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.35

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#f6be8f51ff80f5f5f82ec7c589a984730445f9b4
    oc-note=https://github.com/open-control/note.git#3983c387f04954b22500a6c36d6e9444ef1139c7
    oc-hal-common=https://github.com/open-control/hal-common.git#e3aa784055554922d130bba8065422d11a7dcd02
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#ff7b389be87dbed2d6a35d8fe19c6d7c78650861
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#3884a808e8478009e10d70c74cd7f7050e619803
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#235839489dbbd875e9580a009a1ec228352dcc09
