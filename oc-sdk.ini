; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.39

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#3b8a182422bb1183e5930da0eeb53e584a570dbb
    oc-note=https://github.com/open-control/note.git#539e48a1529165c982e9ea619b2c319ad9128f2b
    oc-hal-common=https://github.com/open-control/hal-common.git#e3aa784055554922d130bba8065422d11a7dcd02
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#f3c49f75aeda045c28d698bca0ec450e20a56838
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#04eeef42aee5b88863a22736af06b52c5815aed1
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#b04f88c32319f9bf62c016d16b3bbb5b71696011
