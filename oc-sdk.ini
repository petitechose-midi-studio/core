; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.33

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#43c574ac9c7b4a8b0bba9ae5992393c8bf03ab9f
    oc-note=https://github.com/open-control/note.git#863ead7ab70a965617c7df0a60eb4750e538c2af
    oc-hal-common=https://github.com/open-control/hal-common.git#e3aa784055554922d130bba8065422d11a7dcd02
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#015ba6f91a23c1d7b6f58c2abfcea09ff83dcf4a
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#9827f5933ae826f30dd6df856966a769f19f6ef2
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#b40208f1d3b6038e9ef0275b5a0f360fcb9ebf04
