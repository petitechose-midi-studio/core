; OpenControl SDK lock for MIDI Studio firmware builds.
;
; This file defines a compatibility set (BOM): a tested combination of OpenControl
; repos pinned by commit SHA.
;
; Rules:
; - Use commit SHAs (no floating refs like main).
; - Bump oc_sdk.version when any pin changes.

[oc_sdk]
version = 0.1.13

[oc_sdk_deps]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#526f885af007dff32615af8bf8ab915127235d5e
    oc-note=https://github.com/open-control/note.git#c4aab1537d570a9ac4444133f38f39d6b34b6928
    oc-hal-common=https://github.com/open-control/hal-common.git#4ead7b65eb5bfa5af4036b96fe53bb6bc0ca24f7
    oc-hal-teensy=https://github.com/open-control/hal-teensy.git#f9dad905dbd58f7779c7fa0884e46d5ceb0d9c6c
    oc-ui-lvgl=https://github.com/open-control/ui-lvgl.git#e58d227a06cb191337b51e05774fb96cd6fd5dc1
    oc-ui-lvgl-components=https://github.com/open-control/ui-lvgl-components.git#622ff81c5ce7d0e681eeb491eab2c2ea96eae69f
