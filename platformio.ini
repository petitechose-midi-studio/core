; MIDI Studio Core - Open Control Migration
;
; Phase 1: Display boot only

[platformio]
default_envs = dev

[env]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 450000000L

build_flags =
    -std=gnu++17
    -D USB_MIDI_SERIAL
    -I src
    -I src/config

lib_ignore =
    lvgl_demos
    lvgl_examples

; Development: local symlinks
[env:dev]
lib_deps =
    open-control=symlink://../../open-control/framework
    open-control-hal-common=symlink://../../open-control/hal-common
    oc-hal-teensy=symlink://../../open-control/hal-teensy
    oc-ui-lvgl=symlink://../../open-control/ui-lvgl
