; MIDI Studio Core - Open Control Migration
;
; Environments:
;   dev     - Local open-control via lib/ symlinks (default, Windows)
;   release - GitHub dependencies

[platformio]
default_envs = dev

[env]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 450000000L
monitor_speed = 115200
monitor_raw = yes

build_flags =
    -std=gnu++17
    -D USB_MIDI_SERIAL
    -I src
    -I src/config

lib_ignore =
    lvgl_demos
    lvgl_examples

; Development: open-control from local symlinks (relative paths)
; IMPORTANT: framework and hal-common must be listed BEFORE hal-teensy/ui-lvgl
; to override their GitHub dependencies in library.json
; The name= prefix must match the "name" field in library.json
; Usage: pio run -e dev
[env:dev]
build_flags = ${env.build_flags}
    -D DEV_MODE
lib_deps =
    framework=symlink://../../open-control/framework
    hal-common=symlink://../../open-control/hal-common
    hal-teensy=symlink://../../open-control/hal-teensy
    ui-lvgl=symlink://../../open-control/ui-lvgl
    ui-lvgl-components=symlink://../../open-control/ui-lvgl-components

; Release: uses PlatformIO Registry
; Only direct dependencies - transitives resolved via library.json
; Usage: pio run -e release
[env:release]
lib_deps =
    open-control/hal-teensy@^0.1.0
    open-control/ui-lvgl@^0.1.0
    open-control/ui-lvgl-components@^0.1.0