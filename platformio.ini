;
; Environments:
;   dev     - Local open-control via symlinks (default)
;   release - GitHub dependencies

[platformio]
default_envs = dev
src_dir = .

[env]
platform = teensy
build_src_filter = +<*> -<build/> -<desktop/> -<docs/> -<asset/> -<sdl/> -<src/config/platform-native/>
board = teensy41
framework = arduino
board_build.f_cpu = 450000000L
monitor_speed = 115200
monitor_raw = yes

; Auto stop/restart OC Bridge service during upload
extra_scripts = post:script/pio/oc_service.py

build_flags =
    -std=gnu++17
    -D USB_MIDI_SERIAL
    -D TEENSY_OPT_SMALLEST_CODE
    -D OC_LOG
    -I src
    -I src/config/platform-teensy

lib_ignore =
    lvgl_demos
    lvgl_examples

; Development: open-control from local symlinks
[env:dev]
build_flags = ${env.build_flags}
    -D DEV_MODE
    -D PERF_MON
    -D MEM_MON
lib_deps =
    framework=symlink://../../open-control/framework
    hal-embedded=symlink://../../open-control/hal-embedded
    hal-teensy=symlink://../../open-control/hal-teensy
    ui-lvgl=symlink://../../open-control/ui-lvgl
    ui-lvgl-components=symlink://../../open-control/ui-lvgl-components