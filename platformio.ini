;
; Environments:
;   dev     - Local open-control via symlinks (default)
;   release - GitHub dependencies (pinned)

[platformio]
default_envs = dev
src_dir = .
extra_configs =
    oc-sdk.ini
    oc-native-sdk.ini

[env:teensy_base]
; Pin the firmware toolchain so workspace-local and global PlatformIO runtimes
; cannot silently link the same build directory with different GCC versions.
platform = platformio/teensy@5.2.0
build_src_filter = +<*> -<build/> -<desktop/> -<docs/> -<asset/> -<sdl/> -<test/> -<tools/> -<benchmark/> -<device-support/qualification/> -<src/config/platform-native/> -<src/validation/project/ProjectModulationBenchmark.cpp>
board = teensy41
framework = arduino
board_build.ldscript = script/pio/imxrt1062_t41_product.ld
board_build.f_cpu = 450000000L
monitor_speed = 115200
monitor_raw = yes

; Auto stop/restart OC Bridge service during upload
extra_scripts =
    post:script/pio/oc_service.py
    post:script/pio/check_memory_budget.py

custom_ram1_min_free = 143360
custom_ram1_code_max = 294912
custom_ram2_min_free = 327680
custom_extram_capacity = 8388608
custom_extram_min_free = 2097152

build_flags =
    -std=gnu++17
    -D USB_MIDI_SERIAL
    -D TEENSY_OPT_SMALLEST_CODE
    -D OC_LOG
    -D OC_COBS_MAX_FRAME_SIZE=32768
    ; A full sequencer-bank apply with an active-track transition produces a
    ; measured 66-entry atomic notification wave. Keep release headroom without
    ; changing the framework default for other OpenControl products.
    -D OC_MAX_PENDING_NOTIFICATIONS=96
    ; Product button IDs currently end at NAV=40. A 48-slot bound preserves
    ; namespace headroom while avoiding 16 unused gesture/latch route entries.
    -D OC_MAX_BUTTONS=48
    -D OC_MAX_BUTTON_BINDINGS=256
    -D OC_MAX_ENCODER_BINDINGS=96
    -I src
    -I device-support/src

lib_ignore =
    lvgl_demos
    lvgl_examples

; Development: open-control from local symlinks
[env:dev]
extends = env:teensy_base
build_flags = ${env:teensy_base.build_flags}
    -D DEV_MODE
    # -D PERF_MON
    # -D MEM_MON
lib_deps =
    ms-ui=symlink://../ui
    oc-note=symlink://../../open-control/note
    oc-framework=symlink://../../open-control/framework
    oc-hal-common=symlink://../../open-control/hal-common
    oc-hal-teensy=symlink://../../open-control/hal-teensy
    oc-ui-lvgl=symlink://../../open-control/ui-lvgl
    oc-ui-lvgl-components=symlink://../../open-control/ui-lvgl-components

; Isolated C++17 compile/link and placement contract for device-support. The
; package manifest owns the real dependency graph; this fast fixture uses the
; same header-shape stubs as its focused native test so repeated pool/provider
; checks do not rebuild all of LVGL. L-R15-04 supplies the real Bitwig graph.
[env:device_support_contract]
platform = platformio/teensy@5.2.0
board = teensy41
framework = arduino
board_build.f_cpu = 450000000L
build_src_filter =
    +<device-support/qualification/main.cpp>
    +<device-support/src/ms/device_support/v1/LvglMemory.cpp>
build_flags =
    -std=c++17
    -D USB_MIDI_SERIAL
    -D TEENSY_OPT_SMALLEST_CODE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I test/device_support_stubs
    -I device-support/src
    -I ../../open-control/framework/src
    -I ../../open-control/hal-common/src

; Development UX recorder: explicit opt-in for Teensy semantic input capture
[env:dev_ux_recorder]
extends = env:dev
board_build.ldscript = script/pio/imxrt1062_t41_ux_recorder.ld
; Recorder-only code may use ten ITCM FlexRAM blocks. Preserve at least 96 KiB
; of DTCM stack/local headroom while keeping the product image at nine blocks.
custom_ram1_min_free = 98304
custom_ram1_code_max = 327680
build_flags = ${env:dev.build_flags}
    -D MS_UX_RECORDER

; Development hardware smoke: project .mspj filesystem save/load on Teensy SD
[env:dev_project_store_smoke]
extends = env:dev
build_flags = ${env:dev.build_flags}
    -D MS_PROJECT_STORE_SMOKE
; This headless target intentionally omits the product UI/realtime image, so
; the full-firmware placement gate cannot apply to it.
extra_scripts = post:script/pio/oc_service.py

; Headless maximum-graph evaluator benchmark. This target deliberately omits
; display, storage, UI, MIDI, and the product main so both hardware revisions
; measure the same Project Control runtime path.
[env:dev_modulation_benchmark]
extends = env:dev
build_src_filter =
    +<benchmark/project_modulation_main.cpp>
    +<src/state/modulation/ProjectModulationAutomationOps.cpp>
    +<src/state/modulation/ProjectModulationBindingOps.cpp>
    +<src/state/modulation/ProjectModulationDomainOps.cpp>
    +<src/state/modulation/ProjectModulationDomainQueries.cpp>
    +<src/state/modulation/ProjectModulationDomainValidation.cpp>
    +<src/state/modulation/ProjectModulationRuntimePlan.cpp>
    +<src/state/modulation/ProjectModulatorSourceOps.cpp>
    +<src/state/modulation/ProjectControlRuntime.cpp>
    +<src/state/modulation/ProjectControlRuntimeAdsr.cpp>
    +<src/state/modulation/ProjectControlRuntimeCurve.cpp>
    +<src/state/modulation/ProjectControlRuntimeEvaluation.cpp>
    +<src/validation/project/ProjectModulationBenchmark.cpp>
lib_deps =
    oc-framework=symlink://../../open-control/framework
extra_scripts =
    post:script/pio/oc_service.py

; Release: pinned GitHub dependencies (no local symlink workspace required)
[env:release]
extends = env:teensy_base
custom_post_link_profile = script/release/profiles/core-product-profile-v1.json
build_flags = ${env:teensy_base.build_flags}
lib_deps =
    ms-ui=https://github.com/petitechose-midi-studio/ui.git#137e49f39c0ed1dd6391af300b764614d39658fb
    ${oc_sdk_deps.lib_deps}

; Opt-in hardware diagnostics. Production and regular development builds contain
; no performance sink, samples, counters, or diagnostic format strings.
[env:dev_diagnostics]
extends = env:dev
board_build.ldscript = script/pio/imxrt1062_t41_diagnostics.ld
custom_diagnostics_build = yes
; Bounded histograms and the PSRAM span tracker live only in this image.
; Allow ten ITCM blocks and retain explicit RAM1/RAM2 diagnostic headroom.
custom_ram1_min_free = 98304
custom_ram1_code_max = 327680
custom_ram2_min_free = 294912
build_flags = ${env:dev.build_flags}
    -D OC_ENABLE_STATS=1

; Product-layout storage qualification. Direct-port markers and fixed scalar
; counters only; no raw trace or reporter. This image is timing authority.
[env:dev_qualification]
extends = env:dev
build_flags = ${env:dev.build_flags}
    -D MS_STORAGE_QUALIFICATION=1

; Attribution-only companion. The fixed 512 KiB trace ring is in PSRAM and
; exports only after the external capture gate is lowered.
[env:dev_qualification_diagnostics]
extends = env:dev_diagnostics
build_flags = ${env:dev_diagnostics.build_flags}
    -D MS_STORAGE_QUALIFICATION=1

[env:native]
platform = native
test_build_src = true
build_src_filter =
    +<src/state/>
    +<src/protocol/>
    +<src/persistence/>
    +<src/sequencer/>
    +<src/validation/>
    +<src/handler/common/>
    +<src/handler/macro/>
    +<src/handler/project/>
    +<src/handler/sequencer/>
    +<src/handler/settings/>
    +<src/handler/transport/>
    +<src/handler/view/>
    +<src/context/standalone/MacroViewActivationContract.cpp>
    +<src/context/standalone/MacroOverlayInvalidationBindings.cpp>
    +<src/context/standalone/SequencerChordFieldPresentation.cpp>
    +<src/context/standalone/SequencerEncoderSyncCoordinator.cpp>
    +<src/ui/common/GlobalTrackNavigationStripModel.cpp>
    +<src/ui/project/ProjectTrackEditorViewModel.cpp>
    +<src/ui/sequencer/SequencerPatternTimelineModel.cpp>
    +<src/ui/sequencer/StepContentBadgeProjection.cpp>
    +<src/ui/sequencer/SequencerStepContentDraftTransitionLabels.cpp>
    +<src/ui/sequencer/SequencerChordPresetPresentation.cpp>
    +<src/ui/sequencer/SequencerPresetLibraryPresentation.cpp>
    +<src/ui/sequencer/SequencerTrackPastePendingViewModel.cpp>
    +<src/ui/sequencer/SequencerTrackPastePreflightViewModel.cpp>
build_flags =
    -std=gnu++17
    -D OC_LOG
    -D MS_CORE_ENABLE_EXTMEM_FAILURE_INJECTION=1
    -D OC_MAX_PENDING_NOTIFICATIONS=96
    -D OC_MAX_BUTTONS=48
    -I src
    -I device-support/src
    -I ../ui/src
lib_deps =
    oc-note=symlink://../../open-control/note
    oc-framework=symlink://../../open-control/framework

[env:native_ci]
extends = env:native
build_flags = ${env:native.build_flags}
lib_deps =
    ${oc_native_sdk_deps.lib_deps}
