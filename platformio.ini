; MIDI Studio Core - Open Control Migration
;
; Environments:
;   dev     - Local open-control via lib/ symlinks (default, Windows)
;   release - GitHub dependencies

[platformio]
default_envs = dev

[env]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 450000000L

build_flags =
    -std=gnu++17
    -D USB_MIDI_SERIAL
    -I src
    -I src/config

lib_ignore =
    lvgl_demos
    lvgl_examples

; Development: open-control from local symlinks (relative paths)
; IMPORTANT: framework and hal-common must be listed BEFORE hal-teensy/ui-lvgl
; to override their GitHub dependencies in library.json
; The name= prefix must match the "name" field in library.json
; Usage: pio run -e dev
[env:dev]
lib_deps =
    open-control=symlink://../../open-control/framework
    open-control-hal-common=symlink://../../open-control/hal-common
    open-control-hal-teensy=symlink://../../open-control/hal-teensy
    open-control-ui-lvgl=symlink://../../open-control/ui-lvgl

; Release: uses GitHub repos (standalone, no local deps required)
; Only direct dependencies - transitives resolved via library.json
; Usage: pio run -e release
[env:release]
lib_deps =
    https://github.com/open-control/hal-teensy
    https://github.com/open-control/ui-lvgl