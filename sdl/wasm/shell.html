<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIDI Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            z-index: 100;
        }

        #header a {
            color: #aaa;
            text-decoration: none;
        }

        #header a:hover {
            color: #fff;
        }

        #canvas-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        #canvas {
            background-color: #202020;
            /* CSS will scale, WASM renders at fixed resolution */
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #888;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading.hidden {
            display: none;
        }

        #footer {
            position: absolute;
            bottom: 10px;
            color: #555;
            font-size: 12px;
        }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
        }

        #midi-select {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #aaa;
            font-size: 12px;
            z-index: 110;
        }

        #midi-select select {
            background: rgba(30, 30, 30, 0.9);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 6px;
            border-radius: 4px;
            max-width: 260px;
        }

        #midi-select button {
            background: rgba(30, 30, 30, 0.9);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        #midi-select button:hover {
            background: rgba(50, 50, 50, 0.9);
        }

        #controls button {
            background: #333;
            color: #aaa;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        #controls button:hover {
            background: #444;
            color: #fff;
        }

        /* Keyboard hints */
        #hints {
            position: absolute;
            bottom: 40px;
            color: #555;
            font-size: 11px;
            text-align: center;
        }

        #hints kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #444;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div id="header">
        <span>MIDI Studio</span> &mdash;
        <a href="https://github.com/miu-lab/midi-studio" target="_blank">GitHub</a>
    </div>

    <div id="controls">
        <button onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div id="midi-select">
        <span>MIDI</span>
        <span>In</span>
        <select id="midi-in"></select>
        <span>Out</span>
        <select id="midi-out"></select>
        <button id="midi-apply" title="Reload with selected ports">Apply</button>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div>Loading MIDI Studio...</div>
    </div>

    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div id="hints">
        <kbd>1</kbd>-<kbd>8</kbd> Macros &nbsp;|&nbsp;
        <kbd>Space</kbd> NAV &nbsp;|&nbsp;
        <kbd>&uarr;</kbd><kbd>&darr;</kbd> NAV Encoder &nbsp;|&nbsp;
        <kbd>&larr;</kbd><kbd>&rarr;</kbd> OPT Encoder &nbsp;|&nbsp;
        <kbd>Esc</kbd> Back
    </div>

    <div id="footer">
        LVGL + SDL2 + Emscripten
    </div>

    <script>
        // =================================================================
        // Configuration
        // =================================================================
        const DEFAULT_SIZE = 800;  // Default canvas size

        // Parse URL parameters
        function getUrlParam(name, defaultValue) {
            const params = new URLSearchParams(window.location.search);
            const value = params.get(name);
            return value ? parseInt(value, 10) : defaultValue;
        }

        const canvasSize = getUrlParam('size', DEFAULT_SIZE);

        // Bridge (oc-bridge) controller WS port
        // Provided by ms CLI via URL: ?bridgeWsPort=8100
        const bridgeWsPort = getUrlParam('bridgeWsPort', 0);

        function buildBridgeWsUrl() {
            if (!bridgeWsPort) return '';
            const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
            const host = location.hostname || 'localhost';
            return `${scheme}://${host}:${bridgeWsPort}`;
        }

        // =================================================================
        // Canvas setup
        // =================================================================
        const canvas = document.getElementById('canvas');
        canvas.width = canvasSize;
        canvas.height = canvasSize;

        // =================================================================
        // WebMIDI initialization
        // =================================================================
        async function initWebMIDI() {
            // Fallback: empty MIDI access (no devices) - prevents libremidi crash
            const emptyAccess = { inputs: new Map(), outputs: new Map() };

            if (!navigator.requestMIDIAccess) {
                console.warn('WebMIDI not supported in this browser');
                globalThis.__libreMidi_access = emptyAccess;
                return null;
            }
            try {
                const access = await navigator.requestMIDIAccess({ sysex: true });

                // Store for libremidi to find.
                globalThis.__libreMidi_access = access;
                console.log('WebMIDI ready:', access.inputs.size, 'inputs,', access.outputs.size, 'outputs');

                return access;
            } catch (err) {
                console.error('WebMIDI access denied:', err);
                // Provide empty access so libremidi doesn't crash
                globalThis.__libreMidi_access = emptyAccess;
                return null;
            }
        }

        // =================================================================
        // MIDI selector UI
        // =================================================================
        const keyPrefix = `midi_studio:${location.pathname}:`;
        const keyIn = `${keyPrefix}midiIn`;
        const keyOut = `${keyPrefix}midiOut`;

        function getSaved(key) {
            try {
                return localStorage.getItem(key) || '';
            } catch {
                return '';
            }
        }

        function setSaved(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch {
                // ignore
            }
        }

        function portLabel(port) {
            const m = port.manufacturer || '';
            const n = port.name || '';
            if (m && n && !n.startsWith(m)) return `${m}:${n}`;
            return n || port.id || '(unnamed)';
        }

        function fillSelect(select, portsMap, savedValue) {
            select.textContent = '';

            const optAuto = document.createElement('option');
            optAuto.value = '';
            optAuto.textContent = 'Auto';
            select.appendChild(optAuto);

            const ports = Array.from(portsMap.values());
            ports.sort((a, b) => portLabel(a).localeCompare(portLabel(b)));
            for (const port of ports) {
                const opt = document.createElement('option');
                opt.value = port.name || '';
                opt.textContent = portLabel(port);
                if (opt.value && opt.value === savedValue) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            }

            // If saved value is not present anymore, keep Auto.
        }

        function buildWasmArgs() {
            const args = [canvasSize.toString()];
            const inName = document.getElementById('midi-in').value;
            const outName = document.getElementById('midi-out').value;
            if (inName) args.push('--midi-in', inName);
            if (outName) args.push('--midi-out', outName);

            const wsUrl = buildBridgeWsUrl();
            if (wsUrl) args.push('--bridge-ws-url', wsUrl);

            return args;
        }

        function applySelection(reload = true) {
            const inName = document.getElementById('midi-in').value;
            const outName = document.getElementById('midi-out').value;
            setSaved(keyIn, inName);
            setSaved(keyOut, outName);
            if (reload) {
                location.reload();
            }
        }

        function setupMidiSelector(access) {
            const selectIn = document.getElementById('midi-in');
            const selectOut = document.getElementById('midi-out');
            const btnApply = document.getElementById('midi-apply');

            const savedIn = getSaved(keyIn);
            const savedOut = getSaved(keyOut);

            fillSelect(selectIn, access.inputs, savedIn);
            fillSelect(selectOut, access.outputs, savedOut);

            btnApply.addEventListener('click', () => applySelection(true));

            access.onstatechange = () => {
                const curIn = getSaved(keyIn);
                const curOut = getSaved(keyOut);
                fillSelect(selectIn, access.inputs, curIn);
                fillSelect(selectOut, access.outputs, curOut);
            };
        }

        // =================================================================
        // libremidi compatibility shim
        // =================================================================
        // libremidi's Emscripten backend uses Module._malloc, Module._free, 
        // and Module.HEAPU8. In newer Emscripten versions, these are globals
        // rather than Module properties. This function patches Module to
        // ensure compatibility.
        function patchLibreMidiModule() {
            try {
                if (!Module) return;
                
                // Patch HEAPU8
                if (typeof HEAPU8 !== 'undefined' && !Module.HEAPU8) {
                    Object.defineProperty(Module, 'HEAPU8', { get: () => HEAPU8 });
                }
                
                // Patch _malloc and _free
                if (typeof _malloc !== 'undefined' && !Module._malloc) {
                    Module._malloc = _malloc;
                }
                if (typeof _free !== 'undefined' && !Module._free) {
                    Module._free = _free;
                }
            } catch {
                // ignore
            }
        }

        // =================================================================
        // Emscripten Module configuration
        // =================================================================
        var Module = {
            print: function(text) {
                console.log('[WASM]', text);
            },
            printErr: function(text) {
                console.error('[WASM]', text);
            },
            canvas: canvas,
            arguments: [canvasSize.toString()],
            noInitialRun: true,  // Don't auto-run main()
            onRuntimeInitialized: async function() {
                try {
                    console.log('WASM runtime ready');

                    // Ensure libremidi can access Emscripten heap and memory functions
                    patchLibreMidiModule();

                    // Initialize WebMIDI BEFORE starting main()
                    const access = await initWebMIDI();
                    if (access) {
                        setupMidiSelector(access);
                    }

                    // Now start the app
                    console.log('Starting MIDI Studio...');
                    Module.arguments = buildWasmArgs();
                    Module.callMain(Module.arguments);

                    document.getElementById('loading').classList.add('hidden');
                } catch (err) {
                    console.error('WASM init failed:', err);
                    if (err && err.stack) {
                        console.error('WASM stack:', err.stack);
                    }
                    const loading = document.getElementById('loading');
                    const message = loading && loading.querySelector('div:last-child');
                    if (message) {
                        message.textContent = `MIDI Studio failed to start: ${err}`;
                    }
                }
            },
            setStatus: function(text) {
                if (text) {
                    console.log('[Status]', text);
                }
            }
        };

        // =================================================================
        // Fullscreen toggle
        // =================================================================
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // =================================================================
        // Focus handling (ensure keyboard events reach the canvas)
        // =================================================================
        window.addEventListener('click', () => {
            window.focus();
        });

        // Prevent default browser shortcuts that might interfere
        window.addEventListener('keydown', (e) => {
            // Prevent space from scrolling
            if (e.code === 'Space') {
                e.preventDefault();
            }
            // Prevent arrow keys from scrolling
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });
    </script>

    {{{ SCRIPT }}}
</body>
</html>
