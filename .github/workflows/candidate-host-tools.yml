name: Candidate Host Tools

run-name: Host Tools Candidate ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Source commit SHA to package"
        required: true
        type: string
      tooling_sha:
        description: "ms-dev-env tooling commit SHA used for candidate metadata"
        required: true
        type: string
      request_id:
        description: "Optional dispatch correlation id"
        required: false
        default: ""
        type: string

concurrency:
  group: candidate-host-tools-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  resolve_inputs:
    name: resolve candidate inputs
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      tooling_sha: ${{ steps.resolve.outputs.tooling_sha }}
      candidate_tag: ${{ steps.resolve.outputs.candidate_tag }}
      qualification_run_id: ${{ steps.resolve.outputs.qualification_run_id }}
      device_support_sha: ${{ steps.resolve.outputs.device_support_sha }}
      open_control_framework_sha: ${{ steps.resolve_bom.outputs.open_control_framework_sha }}
      open_control_note_sha: ${{ steps.resolve_bom.outputs.open_control_note_sha }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source SHA and tooling SHA
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.event }}" != "push" ] || [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
              echo "automatic candidate requires a CI push run on main" >&2
              exit 1
            fi
            source_sha="${{ github.event.workflow_run.head_sha }}"
            tooling_sha="$(python -c 'import json; from pathlib import Path; print(json.loads(Path(".github/release-tooling.json").read_text(encoding="utf-8"))["sha"])')"
            qualification_run_id="${{ github.event.workflow_run.id }}"
          else
            source_sha="${{ inputs.source_sha }}"
            tooling_sha="${{ inputs.tooling_sha }}"
            qualification_run_id=""
          fi
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA: $source_sha" >&2
            exit 1
          fi
          if ! [[ "$tooling_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid tooling SHA: $tooling_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "source SHA is not reachable from main: $source_sha" >&2
            exit 1
          fi
          if [ -z "$qualification_run_id" ]; then
            qualification_run_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$source_sha" \
              -f status=success \
              -f per_page=100 \
              --jq '.workflow_runs[0].id // empty')"
            if [ -z "$qualification_run_id" ]; then
              echo "no successful CI run exists for source SHA: $source_sha" >&2
              exit 1
            fi
          fi
          qualified_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" --jq '.head_sha')"
          qualified_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" --jq '.name')"
          qualified_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" --jq '.conclusion')"
          if [ "$qualified_sha" != "$source_sha" ] || [ "$qualified_name" != "CI" ] || [ "$qualified_conclusion" != "success" ]; then
            echo "CI run ${qualification_run_id} does not qualify source SHA ${source_sha}" >&2
            exit 1
          fi
          successful_unit_jobs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "unit tests" and .conclusion == "success")] | length')"
          if [ "$successful_unit_jobs" -lt 1 ]; then
            echo "CI run ${qualification_run_id} has no successful unit tests job" >&2
            exit 1
          fi
          tooling_repo="$(mktemp -d)"
          git -C "$tooling_repo" init -q
          git -C "$tooling_repo" remote add origin https://github.com/petitechose-midi-studio/ms-dev-env.git
          git -C "$tooling_repo" fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git -C "$tooling_repo" merge-base --is-ancestor "$tooling_sha" refs/remotes/origin/main; then
            echo "tooling SHA is not reachable from ms-dev-env main: $tooling_sha" >&2
            exit 1
          fi
          device_support_sha="$(python - <<'PY'
          from pathlib import Path
          import re

          text = Path("platformio.ini").read_text(encoding="utf-8")
          match = re.search(
              r"(?m)^\s*https://github\.com/"
              r"petitechose-midi-studio/device-support\.git#"
              r"([0-9a-f]{40})\s*$",
              text,
          )
          if match is None:
              raise SystemExit("release device-support dependency is not commit-pinned")
          print(match.group(1))
          PY
          )"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tooling_sha=$tooling_sha" >> "$GITHUB_OUTPUT"
          echo "device_support_sha=$device_support_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=rc-core-host-tools-${source_sha}-tooling-${tooling_sha}" >> "$GITHUB_OUTPUT"
          echo "qualification_run_id=$qualification_run_id" >> "$GITHUB_OUTPUT"

      - name: Resolve native OpenControl BOM
        id: resolve_bom
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import configparser
          import os
          from pathlib import Path
          import re

          bom_path = Path("oc-native-sdk.ini")
          parser = configparser.ConfigParser(interpolation=None)
          try:
              with bom_path.open(encoding="utf-8") as bom_file:
                  parser.read_file(bom_file)
          except (OSError, configparser.Error) as error:
              raise SystemExit(f"cannot read native OpenControl BOM {bom_path}: {error}")

          section = "oc_native_sdk_deps"
          if not parser.has_option(section, "lib_deps"):
              raise SystemExit(f"missing [{section}] lib_deps in {bom_path}")

          pins = {}
          for raw_entry in parser.get(section, "lib_deps").splitlines():
              entry = raw_entry.strip()
              if not entry:
                  continue
              if "=" not in entry:
                  raise SystemExit(f"invalid native OpenControl dependency: {entry}")
              name, source = (part.strip() for part in entry.split("=", 1))
              if name in pins:
                  raise SystemExit(f"duplicate native OpenControl dependency: {name}")
              repository, separator, sha = source.rpartition("#")
              if not separator:
                  raise SystemExit(f"native OpenControl dependency is not pinned: {name}")
              pins[name] = (repository, sha)

          expected = {
              "oc-framework": (
                  "https://github.com/open-control/framework.git",
                  "open_control_framework_sha",
              ),
              "oc-note": (
                  "https://github.com/open-control/note.git",
                  "open_control_note_sha",
              ),
          }
          resolved = {}
          for name, (expected_repository, output_name) in expected.items():
              if name not in pins:
                  raise SystemExit(f"missing native OpenControl dependency: {name}")
              repository, sha = pins[name]
              if repository != expected_repository:
                  raise SystemExit(
                      f"unexpected repository for {name}: {repository or '<empty>'}"
                  )
              if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
                  raise SystemExit(f"invalid commit SHA for {name}: {sha or '<empty>'}")
              resolved[output_name] = sha

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output_file:
              for output_name, sha in resolved.items():
                  print(f"{output_name}={sha}", file=output_file)
                  print(f"resolved {output_name}={sha}")
          PY

  dispatch_marker:
    name: register dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write dispatch marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dispatch
          cat > dispatch/marker.json <<'EOF'
          {"request_id":"${{ inputs.request_id }}"}
          EOF

      - name: Upload dispatch marker
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-${{ inputs.request_id }}
          path: dispatch/marker.json
          retention-days: 1

  build:
    name: host file tool (${{ matrix.platform }})
    needs: resolve_inputs
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            filename: ms-core-file-tool-linux-x86_64
            source: build/core-native/ms-core-file-tool
          - platform: windows-latest
            filename: ms-core-file-tool-windows-x86_64.exe
            source: build/core-native/Release/ms-core-file-tool.exe
          - platform: macos-15-intel
            filename: ms-core-file-tool-macos-x86_64
            source: build/core-native/ms-core-file-tool
          - platform: macos-latest
            filename: ms-core-file-tool-macos-arm64
            source: build/core-native/ms-core-file-tool

    steps:
      - name: Checkout source SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source SHA
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "$sha" != "${{ needs.resolve_inputs.outputs.source_sha }}" ]; then
            echo "Checked out SHA does not match input" >&2
            echo "input=${{ needs.resolve_inputs.outputs.source_sha }}" >&2
            echo "head=$sha" >&2
            exit 1
          fi

      - name: Checkout OpenControl framework
        uses: actions/checkout@v6
        with:
          repository: open-control/framework
          ref: ${{ needs.resolve_inputs.outputs.open_control_framework_sha }}
          path: deps/open-control/framework
          persist-credentials: false

      - name: Checkout OpenControl note
        uses: actions/checkout@v6
        with:
          repository: open-control/note
          ref: ${{ needs.resolve_inputs.outputs.open_control_note_sha }}
          path: deps/open-control/note
          persist-credentials: false

      - name: Checkout device support
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/device-support
          ref: ${{ needs.resolve_inputs.outputs.device_support_sha }}
          path: deps/midi-studio/device-support
          persist-credentials: false

      - name: Configure host file tool
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/core-native \
            -DMS_CORE_OPEN_CONTROL_ROOT="$PWD/deps/open-control" \
            -DMS_DEVICE_SUPPORT_DIR="$PWD/deps/midi-studio/device-support" \
            -DMS_CORE_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build host file tool
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/core-native --target ms-core-file-tool --config Release --parallel

      - name: Collect host file tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ matrix.source }}" "dist/${{ matrix.filename }}"

      - name: Upload host file tool
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}

  metadata:
    name: candidate metadata
    needs:
      - resolve_inputs
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ms-dev-env
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/ms-dev-env
          ref: ${{ needs.resolve_inputs.outputs.tooling_sha }}
          path: workspace
          persist-credentials: false

      - name: Setup ms runtime
        uses: ./workspace/.github/actions/setup-ms-runtime
        with:
          working-directory: workspace

      - name: Download host file tools
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ms-core-file-tool-*
          merge-multiple: true

      - name: Generate candidate metadata inputs
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/candidate-artifacts.json <<'EOF'
          [
            {
              "id": "ms-core-file-tool-linux-x86_64",
              "filename": "ms-core-file-tool-linux-x86_64",
              "kind": "binary",
              "os": "linux",
              "arch": "x86_64"
            },
            {
              "id": "ms-core-file-tool-windows-x86_64",
              "filename": "ms-core-file-tool-windows-x86_64.exe",
              "kind": "binary",
              "os": "windows",
              "arch": "x86_64"
            },
            {
              "id": "ms-core-file-tool-macos-x86_64",
              "filename": "ms-core-file-tool-macos-x86_64",
              "kind": "binary",
              "os": "macos",
              "arch": "x86_64"
            },
            {
              "id": "ms-core-file-tool-macos-arm64",
              "filename": "ms-core-file-tool-macos-arm64",
              "kind": "binary",
              "os": "macos",
              "arch": "arm64"
            }
          ]
          EOF
          cat > artifacts/input-repos.json <<'EOF'
          [
            {
              "id": "core",
              "repo": "petitechose-midi-studio/core",
              "sha": "${{ needs.resolve_inputs.outputs.source_sha }}"
            },
            {
              "id": "device-support",
              "repo": "petitechose-midi-studio/device-support",
              "sha": "${{ needs.resolve_inputs.outputs.device_support_sha }}"
            },
            {
              "id": "ms-dev-env",
              "repo": "petitechose-midi-studio/ms-dev-env",
              "sha": "${{ needs.resolve_inputs.outputs.tooling_sha }}"
            }
          ]
          EOF
          cat > artifacts/toolchain.json <<'EOF'
          {
            "python": "3.13",
            "cmake": "system"
          }
          EOF
          cat > artifacts/config.json <<'EOF'
          {
            "qualified_ci_run_id": "${{ needs.resolve_inputs.outputs.qualification_run_id }}",
            "qualified_ci_workflow": "CI"
          }
          EOF
          ls -la artifacts

      - name: Write candidate manifest, checksums, and signature
        shell: bash
        working-directory: workspace
        env:
          MS_CANDIDATE_ED25519_SK: ${{ secrets.MS_CANDIDATE_ED25519_SK }}
        run: |
          set -euo pipefail
          uv run ms release candidate write \
            --artifacts-dir ../artifacts \
            --artifacts-json ../artifacts/candidate-artifacts.json \
            --input-repos-json ../artifacts/input-repos.json \
            --producer-repo petitechose-midi-studio/core \
            --producer-kind core-host-tools \
            --workflow-file .github/workflows/candidate-host-tools.yml \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --manifest-path ../artifacts/candidate.json \
            --checksums-path ../artifacts/checksums.txt \
            --sig-path ../artifacts/candidate.json.sig \
            --recipe-base-dir .. \
            --recipe-path .github/workflows/ci.yml \
            --recipe-path .github/workflows/candidate-host-tools.yml \
            --recipe-path CMakeLists.txt \
            --recipe-path cmake/MsCoreSources.cmake \
            --recipe-path cmake/MsCoreProjectFileTool.cmake \
            --recipe-path oc-sdk.ini \
            --recipe-path oc-native-sdk.ini \
            --recipe-path src/persistence/PersistenceChecksum.hpp \
            --recipe-path src/persistence/PersistenceChecksum.cpp \
            --recipe-path src/persistence/ProjectFileContainer.hpp \
            --recipe-path src/persistence/ProjectFileContainer.cpp \
            --recipe-path src/persistence/ProjectFileInspection.hpp \
            --recipe-path src/persistence/ProjectFileInspection.cpp \
            --recipe-path src/persistence/ProjectFileLimits.hpp \
            --recipe-path src/persistence/SequencerGraphAssetCodec.hpp \
            --recipe-path src/persistence/SequencerGraphAssetCodec.cpp \
            --recipe-path src/persistence/SequencerGraphRecordCodec.hpp \
            --recipe-path src/persistence/SequencerGraphRecordCodec.cpp \
            --recipe-path src/state/project/ProjectSnapshotLifecycle.cpp \
            --recipe-path src/state/sequencer/SequencerGraphAsset.hpp \
            --recipe-path src/state/sequencer/SequencerGraphAsset.cpp \
            --recipe-path src/state/sequencer/SequencerGraphCanonicalPolicy.hpp \
            --recipe-path src/state/sequencer/SequencerGraphCanonicalPolicy.cpp \
            --recipe-path tools/ms_core_file_tool/main.cpp \
            --recipe-path tools/ms_core_file_tool/StepGraphPresetTool.hpp \
            --recipe-path tools/ms_core_file_tool/StepGraphPresetTool.cpp \
            --config-json ../artifacts/config.json \
            --toolchain-json ../artifacts/toolchain.json

      - name: Publish signed candidate release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve_inputs.outputs.candidate_tag }}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "candidate release already exists: $tag" >&2
            exit 1
          fi
          gh release create \
            "$tag" \
            artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "candidate $tag" \
            --notes "Core host tools candidate artifacts for ${{ needs.resolve_inputs.outputs.source_sha }}" \
            --prerelease
          gh release edit \
            "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease
