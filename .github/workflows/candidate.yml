name: Candidate

run-name: Candidate ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Source commit SHA to package"
        required: true
        type: string
      tooling_sha:
        description: "ms-dev-env tooling commit SHA used for candidate metadata"
        required: true
        type: string
      request_id:
        description: "Optional dispatch correlation id"
        required: false
        default: ""
        type: string

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  resolve_inputs:
    name: resolve candidate inputs
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      tooling_sha: ${{ steps.resolve.outputs.tooling_sha }}
      candidate_tag: ${{ steps.resolve.outputs.candidate_tag }}
      qualification_run_id: ${{ steps.resolve.outputs.qualification_run_id }}
      device_support_sha: ${{ steps.resolve.outputs.device_support_sha }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source SHA and tooling SHA
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.event }}" != "push" ] || [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
              echo "automatic candidate requires a CI push run on main" >&2
              exit 1
            fi
            source_sha="${{ github.event.workflow_run.head_sha }}"
            tooling_sha="$(python -c 'import json; from pathlib import Path; print(json.loads(Path(".github/release-tooling.json").read_text(encoding="utf-8"))["sha"])')"
            qualification_run_id="${{ github.event.workflow_run.id }}"
          else
            source_sha="${{ inputs.source_sha }}"
            tooling_sha="${{ inputs.tooling_sha }}"
            qualification_run_id=""
          fi
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source SHA: $source_sha" >&2
            exit 1
          fi
          if ! [[ "$tooling_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid tooling SHA: $tooling_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "source SHA is not reachable from main: $source_sha" >&2
            exit 1
          fi
          if [ -z "$qualification_run_id" ]; then
            qualification_run_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$source_sha" \
              -f status=success \
              -f per_page=100 \
              --jq '.workflow_runs[0].id // empty')"
            if [ -z "$qualification_run_id" ]; then
              echo "no successful CI run exists for source SHA: $source_sha" >&2
              exit 1
            fi
          fi
          qualified_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" --jq '.head_sha')"
          qualified_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" --jq '.name')"
          qualified_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}" --jq '.conclusion')"
          if [ "$qualified_sha" != "$source_sha" ] || [ "$qualified_name" != "CI" ] || [ "$qualified_conclusion" != "success" ]; then
            echo "CI run ${qualification_run_id} does not qualify source SHA ${source_sha}" >&2
            exit 1
          fi
          successful_unit_jobs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "unit tests" and .conclusion == "success")] | length')"
          if [ "$successful_unit_jobs" -lt 1 ]; then
            echo "CI run ${qualification_run_id} has no successful unit tests job" >&2
            exit 1
          fi
          tooling_repo="$(mktemp -d)"
          git -C "$tooling_repo" init -q
          git -C "$tooling_repo" remote add origin https://github.com/petitechose-midi-studio/ms-dev-env.git
          git -C "$tooling_repo" fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git -C "$tooling_repo" merge-base --is-ancestor "$tooling_sha" refs/remotes/origin/main; then
            echo "tooling SHA is not reachable from ms-dev-env main: $tooling_sha" >&2
            exit 1
          fi
          device_support_sha="$(python - <<'PY'
          from pathlib import Path
          import re

          text = Path("platformio.ini").read_text(encoding="utf-8")
          match = re.search(
              r"(?m)^\s*https://github\.com/"
              r"petitechose-midi-studio/device-support\.git#"
              r"([0-9a-f]{40})\s*$",
              text,
          )
          if match is None:
              raise SystemExit("release device-support dependency is not commit-pinned")
          print(match.group(1))
          PY
          )"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tooling_sha=$tooling_sha" >> "$GITHUB_OUTPUT"
          echo "device_support_sha=$device_support_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=rc-${source_sha}-tooling-${tooling_sha}" >> "$GITHUB_OUTPUT"
          echo "qualification_run_id=$qualification_run_id" >> "$GITHUB_OUTPUT"

  dispatch_marker:
    name: register dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write dispatch marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dispatch
          cat > dispatch/marker.json <<'EOF'
          {"request_id":"${{ inputs.request_id }}"}
          EOF

      - name: Upload dispatch marker
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-${{ inputs.request_id }}
          path: dispatch/marker.json
          retention-days: 1

  metadata:
    name: candidate metadata
    needs: resolve_inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ms-dev-env
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/ms-dev-env
          ref: ${{ needs.resolve_inputs.outputs.tooling_sha }}
          path: workspace
          persist-credentials: false

      - name: Setup ms runtime
        uses: ./workspace/.github/actions/setup-ms-runtime
        with:
          working-directory: workspace

      - name: Download candidate firmware
        uses: actions/download-artifact@v8
        with:
          name: midi-studio-default-firmware
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve_inputs.outputs.qualification_run_id }}

      - name: Validate qualified firmware evidence
        shell: bash
        run: |
          set -euo pipefail
          python script/release/validate_core_candidate_artifacts.py \
            --artifacts-dir artifacts

      - name: Generate candidate metadata inputs
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/candidate-artifacts.json <<'EOF'
          [
            {
              "id": "firmware-default",
              "filename": "midi-studio-default-firmware.hex",
              "kind": "firmware"
            },
            {
              "id": "firmware-default-elf",
              "filename": "midi-studio-default-firmware.elf",
              "kind": "elf"
            },
            {
              "id": "firmware-default-map",
              "filename": "midi-studio-default-firmware.map",
              "kind": "link-map"
            },
            {
              "id": "firmware-default-post-link",
              "filename": "midi-studio-default-post-link.json",
              "kind": "post-link-report"
            },
            {
              "id": "firmware-default-product-profile",
              "filename": "midi-studio-default-product-profile.json",
              "kind": "product-profile"
            }
          ]
          EOF
          cat > artifacts/input-repos.json <<'EOF'
          [
            {
              "id": "core",
              "repo": "petitechose-midi-studio/core",
              "sha": "${{ needs.resolve_inputs.outputs.source_sha }}"
            },
            {
              "id": "device-support",
              "repo": "petitechose-midi-studio/device-support",
              "sha": "${{ needs.resolve_inputs.outputs.device_support_sha }}"
            },
            {
              "id": "ms-dev-env",
              "repo": "petitechose-midi-studio/ms-dev-env",
              "sha": "${{ needs.resolve_inputs.outputs.tooling_sha }}"
            }
          ]
          EOF
          cat > artifacts/toolchain.json <<'EOF'
          {
            "python": "3.13",
            "platformio": "6.1.18"
          }
          EOF
          cat > artifacts/config.json <<'EOF'
          {
            "qualified_ci_run_id": "${{ needs.resolve_inputs.outputs.qualification_run_id }}",
            "qualified_ci_workflow": "CI",
            "post_link_profile": "midi-studio-core-teensy41@release-2026.08/release-current"
          }
          EOF

      - name: Write candidate manifest, checksums, and signature
        shell: bash
        working-directory: workspace
        env:
          MS_CANDIDATE_ED25519_SK: ${{ secrets.MS_CANDIDATE_ED25519_SK }}
        run: |
          set -euo pipefail
          uv run ms release candidate write \
            --artifacts-dir ../artifacts \
            --artifacts-json ../artifacts/candidate-artifacts.json \
            --input-repos-json ../artifacts/input-repos.json \
            --producer-repo petitechose-midi-studio/core \
            --producer-kind core-default-firmware \
            --workflow-file .github/workflows/candidate.yml \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --manifest-path ../artifacts/candidate.json \
            --checksums-path ../artifacts/checksums.txt \
            --sig-path ../artifacts/candidate.json.sig \
            --recipe-base-dir .. \
            --recipe-path .github/workflows/ci.yml \
            --recipe-path .github/workflows/candidate.yml \
            --recipe-path platformio.ini \
            --recipe-path oc-sdk.ini \
            --recipe-path oc-native-sdk.ini \
            --recipe-path script/pio/check_memory_budget.py \
            --recipe-path script/release/teensy_post_link_gate_v1.py \
            --recipe-path script/release/profiles/core-product-profile-v1.json \
            --recipe-path script/release/validate_core_candidate_artifacts.py \
            --config-json ../artifacts/config.json \
            --toolchain-json ../artifacts/toolchain.json

      - name: Publish signed candidate release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve_inputs.outputs.candidate_tag }}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "candidate release already exists: $tag" >&2
            exit 1
          fi
          gh release create \
            "$tag" \
            artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "candidate $tag" \
            --notes "Candidate artifacts for ${{ needs.resolve_inputs.outputs.source_sha }}" \
            --prerelease
          gh release edit \
            "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease
