name: Architecture contract self-tests

on:
  push:
    branches: [main]
    paths:
      - script/dev/check-architecture-contracts.py
      - .github/workflows/architecture-contract-self-tests.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-contract-self-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self_tests:
    name: architecture contract self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Self-test architecture contract checker
        run: python script/dev/check-architecture-contracts.py --self-test
