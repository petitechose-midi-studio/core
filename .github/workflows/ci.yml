name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.1.18"
  MS_DEV_ENV_REPOSITORY: petitechose-midi-studio/ms-dev-env
  MS_DEV_ENV_SHA: ec565d041d6b1e61c5bc5cd6d2b8cf8af5f8162f
  OPEN_CONTROL_FRAMEWORK_SHA: 3a29ba81686145de225d1571d1d51bed5dffde3a
  OPEN_CONTROL_NOTE_SHA: 863ead7ab70a965617c7df0a60eb4750e538c2af

  OPEN_CONTROL_HAL_MIDI_SHA: 9157bea72dddd91a20c32a89c89a3f00b3bf9059
  OPEN_CONTROL_HAL_NET_SHA: 2207e6befc4b18fad5e4db870ba5ca8aab13aa29
  OPEN_CONTROL_HAL_SDL_SHA: f8755529b4240bf05547d3ab6eadc92d823882c3
  OPEN_CONTROL_UI_LVGL_SHA: 9827f5933ae826f30dd6df856966a769f19f6ef2
  OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA: b40208f1d3b6038e9ef0275b5a0f360fcb9ebf04
  MIDI_STUDIO_UI_SHA: bd822d51a08d60172b04f3d8aae3f825d1ec717d
  OPEN_CONTROL_HAL_COMMON_SHA: e3aa784055554922d130bba8065422d11a7dcd02
jobs:
  firmware_release:
    name: firmware (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'oc-sdk.ini', 'oc-native-sdk.ini') }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m platformio run -e release

      - name: Collect qualified firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ".pio/build/release/firmware.hex" "dist/midi-studio-default-firmware.hex"
          cp ".pio/build/release/firmware.elf" "dist/midi-studio-default-firmware.elf"
          cp ".pio/build/release/firmware.map" "dist/midi-studio-default-firmware.map"
          cp ".pio/build/release/post-link/report.json" "dist/midi-studio-default-post-link.json"
          cp "script/release/profiles/core-product-profile-v1.json" "dist/midi-studio-default-product-profile.json"

      - name: Upload qualified firmware
        uses: actions/upload-artifact@v7
        with:
          name: midi-studio-default-firmware
          path: dist/
          retention-days: 14

  unit_tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ms-dev-env
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MS_DEV_ENV_REPOSITORY }}
          ref: ${{ env.MS_DEV_ENV_SHA }}
          path: workspace
          persist-credentials: false

      - name: Checkout framework
        uses: actions/checkout@v6
        with:
          repository: open-control/framework
          ref: ${{ env.OPEN_CONTROL_FRAMEWORK_SHA }}
          path: workspace/open-control/framework
          persist-credentials: false

      - name: Checkout note
        uses: actions/checkout@v6
        with:
          repository: open-control/note
          ref: ${{ env.OPEN_CONTROL_NOTE_SHA }}
          path: workspace/open-control/note
          persist-credentials: false

      - name: Checkout HAL Common
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-common
          ref: ${{ env.OPEN_CONTROL_HAL_COMMON_SHA }}
          path: workspace/open-control/hal-common
          persist-credentials: false

      - name: Checkout UI
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/ui
          ref: ${{ env.MIDI_STUDIO_UI_SHA }}
          path: workspace/midi-studio/ui
          persist-credentials: false

      - name: Checkout core
        uses: actions/checkout@v6
        with:
          path: workspace/midi-studio/core
          persist-credentials: false

      - name: Setup ms runtime
        uses: ./workspace/.github/actions/setup-ms-runtime
        with:
          working-directory: workspace

      - name: Architecture contracts
        working-directory: workspace/midi-studio/core
        run: python script/dev/check-architecture-contracts.py

      - name: Cache ms test tools
        uses: actions/cache@v5
        with:
          path: |
            workspace/tools
            workspace/.ms/cache/downloads
            workspace/.ms/cache/test-deps
          key: ${{ runner.os }}-ms-test-tools-${{ env.MS_DEV_ENV_SHA }}-${{ hashFiles('workspace/ms/data/toolchains.toml', 'workspace/ms/data/test_dependencies.toml') }}
          restore-keys: |
            ${{ runner.os }}-ms-test-tools-${{ env.MS_DEV_ENV_SHA }}-

      - name: Sync test tools
        working-directory: workspace
        run: uv run ms sync --test-tools

      - name: Test
        working-directory: workspace
        run: uv run ms test core
