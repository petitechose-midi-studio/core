name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.1.18"
  MS_DEV_ENV_REPOSITORY: petitechose-midi-studio/ms-dev-env
  MS_DEV_ENV_SHA: 66afd56f734d1c5bbac5a651d346ba1cd98b6a4e
  OPEN_CONTROL_FRAMEWORK_SHA: e214a1f24f74075e253bd33b94b5f0398da07257
  OPEN_CONTROL_NOTE_SHA: 3d2eacb574e677eee38bde5bbf9fe9416f6d4814

  OPEN_CONTROL_HAL_MIDI_SHA: f1f080449cc37378977a30aa344a7a6b4b209c27
  OPEN_CONTROL_HAL_NET_SHA: f37a8ed152ee0c02a2926ceed4ff011c36a249fe
  OPEN_CONTROL_HAL_SDL_SHA: adeb3728aaaa92bbb2823fb84ebad495b983e986
  OPEN_CONTROL_UI_LVGL_SHA: e58d227a06cb191337b51e05774fb96cd6fd5dc1
  OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA: 4bb5b0ad8ebb608a5d8623245f12fc2aa8b8635c
  MIDI_STUDIO_UI_SHA: ad851a124af511579f81f54a0a373145d9514449
jobs:
  firmware_release:
    name: firmware (release)
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'oc-sdk.ini', 'oc-native-sdk.ini') }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m platformio run -e release

  unit_tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ms-dev-env
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MS_DEV_ENV_REPOSITORY }}
          ref: ${{ env.MS_DEV_ENV_SHA }}
          path: workspace
          persist-credentials: false

      - name: Checkout framework
        uses: actions/checkout@v6
        with:
          repository: open-control/framework
          ref: ${{ env.OPEN_CONTROL_FRAMEWORK_SHA }}
          path: workspace/open-control/framework
          persist-credentials: false

      - name: Checkout note
        uses: actions/checkout@v6
        with:
          repository: open-control/note
          ref: ${{ env.OPEN_CONTROL_NOTE_SHA }}
          path: workspace/open-control/note
          persist-credentials: false

      - name: Checkout core
        uses: actions/checkout@v6
        with:
          path: workspace/midi-studio/core
          persist-credentials: false

      - name: Setup ms runtime
        uses: ./workspace/.github/actions/setup-ms-runtime
        with:
          working-directory: workspace

      - name: Cache ms test tools
        uses: actions/cache@v5
        with:
          path: |
            workspace/tools
            workspace/.ms/cache/downloads
            workspace/.ms/cache/test-deps
          key: ${{ runner.os }}-ms-test-tools-${{ env.MS_DEV_ENV_SHA }}-${{ hashFiles('workspace/ms/data/toolchains.toml', 'workspace/ms/data/test_dependencies.toml') }}
          restore-keys: |
            ${{ runner.os }}-ms-test-tools-${{ env.MS_DEV_ENV_SHA }}-

      - name: Sync test tools
        working-directory: workspace
        run: uv run ms sync --test-tools

      - name: Test
        working-directory: workspace
        run: uv run ms test core

      - name: Build Core host file tool
        working-directory: workspace/midi-studio/core
        run: |
          cmake -S . -B build/core-native -DMS_CORE_BUILD_TESTS=OFF
          cmake --build build/core-native --target ms-core-file-tool --parallel

      - name: Validate project migration fixtures with host file tool
        working-directory: workspace/midi-studio/core
        run: python script/dev/validate-project-fixtures.py
