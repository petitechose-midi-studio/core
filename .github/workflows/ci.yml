name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.1.18"
  MS_DEV_ENV_REPOSITORY: petitechose-midi-studio/ms-dev-env
  MS_DEV_ENV_SHA: 2f6f8af02afc5b8af9096f83319953d7d9829dd5
  MIDI_STUDIO_BITWIG_SHA: bb81912399ee5db82395dd864e7ed481efeeff92
  MIDI_STUDIO_DEVICE_SUPPORT_SHA: 923550edbd8bb0a7bef3bee74248cc1e116db6e3
  OPEN_CONTROL_FRAMEWORK_SHA: 3b8a182422bb1183e5930da0eeb53e584a570dbb
  OPEN_CONTROL_NOTE_SHA: 539e48a1529165c982e9ea619b2c319ad9128f2b

  OPEN_CONTROL_HAL_TEENSY_SHA: f3c49f75aeda045c28d698bca0ec450e20a56838
  OPEN_CONTROL_HAL_MIDI_SHA: d18a6cc2437d3ecd1b974d05be17be3e0e02aeac
  OPEN_CONTROL_HAL_NET_SHA: 2207e6befc4b18fad5e4db870ba5ca8aab13aa29
  OPEN_CONTROL_HAL_SDL_SHA: f8755529b4240bf05547d3ab6eadc92d823882c3
  OPEN_CONTROL_UI_LVGL_SHA: 04eeef42aee5b88863a22736af06b52c5815aed1
  OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA: b04f88c32319f9bf62c016d16b3bbb5b71696011
  MIDI_STUDIO_UI_SHA: 1cdf21526f6f08e49ac21f4fc466119e6468c9b3
  OPEN_CONTROL_HAL_COMMON_SHA: e3aa784055554922d130bba8065422d11a7dcd02
  LVGL_SHA: 85aa60d18b3d5e5588d7b247abf90198f07c8a63
  EMSDK_VERSION: 4.0.23
  EMSDK_SHA: c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56
jobs:
  firmware_release:
    name: firmware (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'oc-sdk.ini', 'oc-native-sdk.ini') }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m platformio run -e release

      - name: Collect qualified firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ".pio/build/release/firmware.hex" "dist/midi-studio-default-firmware.hex"
          cp ".pio/build/release/firmware.elf" "dist/midi-studio-default-firmware.elf"
          cp ".pio/build/release/firmware.map" "dist/midi-studio-default-firmware.map"
          cp ".pio/build/release/post-link/report.json" "dist/midi-studio-default-post-link.json"
          cp "script/release/profiles/core-product-profile-v1.json" "dist/midi-studio-default-product-profile.json"

      - name: Upload qualified firmware
        uses: actions/upload-artifact@v7
        with:
          name: midi-studio-default-firmware
          path: dist/
          retention-days: 14

  native_tests:
    name: native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ms-dev-env
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MS_DEV_ENV_REPOSITORY }}
          ref: ${{ env.MS_DEV_ENV_SHA }}
          path: workspace
          persist-credentials: false

      - name: Checkout framework
        uses: actions/checkout@v6
        with:
          repository: open-control/framework
          ref: ${{ env.OPEN_CONTROL_FRAMEWORK_SHA }}
          path: workspace/open-control/framework
          persist-credentials: false

      - name: Checkout Bitwig
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/plugin-bitwig
          ref: ${{ env.MIDI_STUDIO_BITWIG_SHA }}
          path: workspace/midi-studio/plugin-bitwig
          persist-credentials: false

      - name: Checkout note
        uses: actions/checkout@v6
        with:
          repository: open-control/note
          ref: ${{ env.OPEN_CONTROL_NOTE_SHA }}
          path: workspace/open-control/note
          persist-credentials: false

      - name: Checkout HAL Common
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-common
          ref: ${{ env.OPEN_CONTROL_HAL_COMMON_SHA }}
          path: workspace/open-control/hal-common
          persist-credentials: false

      - name: Checkout HAL Teensy
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-teensy
          ref: ${{ env.OPEN_CONTROL_HAL_TEENSY_SHA }}
          path: workspace/open-control/hal-teensy
          persist-credentials: false

      - name: Checkout HAL MIDI
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-midi
          ref: ${{ env.OPEN_CONTROL_HAL_MIDI_SHA }}
          path: workspace/open-control/hal-midi
          persist-credentials: false

      - name: Checkout HAL Net
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-net
          ref: ${{ env.OPEN_CONTROL_HAL_NET_SHA }}
          path: workspace/open-control/hal-net
          persist-credentials: false

      - name: Checkout HAL SDL
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-sdl
          ref: ${{ env.OPEN_CONTROL_HAL_SDL_SHA }}
          path: workspace/open-control/hal-sdl
          persist-credentials: false

      - name: Checkout UI LVGL
        uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_SHA }}
          path: workspace/open-control/ui-lvgl
          persist-credentials: false

      - name: Checkout UI LVGL Components
        uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl-components
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA }}
          path: workspace/open-control/ui-lvgl-components
          persist-credentials: false

      - name: Checkout UI
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/ui
          ref: ${{ env.MIDI_STUDIO_UI_SHA }}
          path: workspace/midi-studio/ui
          persist-credentials: false

      - name: Checkout core
        uses: actions/checkout@v6
        with:
          path: workspace/midi-studio/core
          persist-credentials: false

      - name: Checkout device support
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/device-support
          ref: ${{ env.MIDI_STUDIO_DEVICE_SUPPORT_SHA }}
          path: workspace/midi-studio/device-support
          persist-credentials: false

      - name: Build topology
        working-directory: workspace/midi-studio/core
        run: python script/dev/check-build-topology.py --workspace-root "${{ github.workspace }}/workspace" --check

      - name: Setup ms runtime
        uses: ./workspace/.github/actions/setup-ms-runtime
        with:
          working-directory: workspace

      - name: Architecture contracts
        working-directory: workspace/midi-studio/core
        run: python script/dev/check-architecture-contracts.py

      - name: Cache ms test tools
        uses: actions/cache@v5
        with:
          path: |
            workspace/tools
            workspace/.ms/cache/downloads
            workspace/.ms/cache/test-deps
          key: ${{ runner.os }}-ms-test-tools-${{ env.MS_DEV_ENV_SHA }}-${{ hashFiles('workspace/ms/data/toolchains.toml', 'workspace/ms/data/test_dependencies.toml') }}
          restore-keys: |
            ${{ runner.os }}-ms-test-tools-${{ env.MS_DEV_ENV_SHA }}-

      - name: Sync test tools
        working-directory: workspace
        run: uv run ms sync --test-tools

      - name: Test
        working-directory: workspace
        run: uv run ms test core

  sdl_native:
    name: SDL native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          path: workspace/midi-studio/core
          persist-credentials: false

      - name: Checkout device support
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/device-support
          ref: ${{ env.MIDI_STUDIO_DEVICE_SUPPORT_SHA }}
          path: workspace/midi-studio/device-support
          persist-credentials: false

      - name: Checkout framework
        uses: actions/checkout@v6
        with:
          repository: open-control/framework
          ref: ${{ env.OPEN_CONTROL_FRAMEWORK_SHA }}
          path: workspace/open-control/framework
          persist-credentials: false

      - name: Checkout note
        uses: actions/checkout@v6
        with:
          repository: open-control/note
          ref: ${{ env.OPEN_CONTROL_NOTE_SHA }}
          path: workspace/open-control/note
          persist-credentials: false

      - name: Checkout HAL MIDI
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-midi
          ref: ${{ env.OPEN_CONTROL_HAL_MIDI_SHA }}
          path: workspace/open-control/hal-midi
          persist-credentials: false

      - name: Checkout HAL Net
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-net
          ref: ${{ env.OPEN_CONTROL_HAL_NET_SHA }}
          path: workspace/open-control/hal-net
          persist-credentials: false

      - name: Checkout HAL SDL
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-sdl
          ref: ${{ env.OPEN_CONTROL_HAL_SDL_SHA }}
          path: workspace/open-control/hal-sdl
          persist-credentials: false

      - name: Checkout UI LVGL
        uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_SHA }}
          path: workspace/open-control/ui-lvgl
          persist-credentials: false

      - name: Checkout UI LVGL Components
        uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl-components
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA }}
          path: workspace/open-control/ui-lvgl-components
          persist-credentials: false

      - name: Checkout UI
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/ui
          ref: ${{ env.MIDI_STUDIO_UI_SHA }}
          path: workspace/midi-studio/ui
          persist-credentials: false

      - name: Checkout LVGL
        uses: actions/checkout@v6
        with:
          repository: lvgl/lvgl
          ref: ${{ env.LVGL_SHA }}
          path: workspace/deps/lvgl
          persist-credentials: false

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libsdl2-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            ninja-build

      - name: Build SDL native
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S workspace/midi-studio/core/sdl \
            -B workspace/.build/core-sdl-native \
            -G Ninja \
            -DAPP_PATH="${GITHUB_WORKSPACE}/workspace/midi-studio/core/sdl" \
            -DBIN_OUTPUT_DIR="${GITHUB_WORKSPACE}/workspace/bin" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_CONTROL_FRAMEWORK_DIR="${GITHUB_WORKSPACE}/workspace/open-control/framework" \
            -DOPEN_CONTROL_UI_LVGL_DIR="${GITHUB_WORKSPACE}/workspace/open-control/ui-lvgl" \
            -DOPEN_CONTROL_UI_COMPONENTS_DIR="${GITHUB_WORKSPACE}/workspace/open-control/ui-lvgl-components" \
            -DOPEN_CONTROL_HAL_SDL_DIR="${GITHUB_WORKSPACE}/workspace/open-control/hal-sdl" \
            -DOPEN_CONTROL_HAL_NET_DIR="${GITHUB_WORKSPACE}/workspace/open-control/hal-net" \
            -DOPEN_CONTROL_HAL_MIDI_DIR="${GITHUB_WORKSPACE}/workspace/open-control/hal-midi" \
            -DOPEN_CONTROL_NOTE_DIR="${GITHUB_WORKSPACE}/workspace/open-control/note" \
            -DMIDI_STUDIO_UI_DIR="${GITHUB_WORKSPACE}/workspace/midi-studio/ui" \
            -DMS_DEVICE_SUPPORT_DIR="${GITHUB_WORKSPACE}/workspace/midi-studio/device-support" \
            -DLVGL_DIR="${GITHUB_WORKSPACE}/workspace/deps/lvgl"
          cmake --build workspace/.build/core-sdl-native --parallel
          test -x workspace/bin/core/native/midi_studio_core

  sdl_wasm:
    name: SDL WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          path: workspace/midi-studio/core
          persist-credentials: false

      - name: Checkout device support
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/device-support
          ref: ${{ env.MIDI_STUDIO_DEVICE_SUPPORT_SHA }}
          path: workspace/midi-studio/device-support
          persist-credentials: false

      - name: Checkout framework
        uses: actions/checkout@v6
        with:
          repository: open-control/framework
          ref: ${{ env.OPEN_CONTROL_FRAMEWORK_SHA }}
          path: workspace/open-control/framework
          persist-credentials: false

      - name: Checkout note
        uses: actions/checkout@v6
        with:
          repository: open-control/note
          ref: ${{ env.OPEN_CONTROL_NOTE_SHA }}
          path: workspace/open-control/note
          persist-credentials: false

      - name: Checkout HAL MIDI
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-midi
          ref: ${{ env.OPEN_CONTROL_HAL_MIDI_SHA }}
          path: workspace/open-control/hal-midi
          persist-credentials: false

      - name: Checkout HAL Net
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-net
          ref: ${{ env.OPEN_CONTROL_HAL_NET_SHA }}
          path: workspace/open-control/hal-net
          persist-credentials: false

      - name: Checkout HAL SDL
        uses: actions/checkout@v6
        with:
          repository: open-control/hal-sdl
          ref: ${{ env.OPEN_CONTROL_HAL_SDL_SHA }}
          path: workspace/open-control/hal-sdl
          persist-credentials: false

      - name: Checkout UI LVGL
        uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_SHA }}
          path: workspace/open-control/ui-lvgl
          persist-credentials: false

      - name: Checkout UI LVGL Components
        uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl-components
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA }}
          path: workspace/open-control/ui-lvgl-components
          persist-credentials: false

      - name: Checkout UI
        uses: actions/checkout@v6
        with:
          repository: petitechose-midi-studio/ui
          ref: ${{ env.MIDI_STUDIO_UI_SHA }}
          path: workspace/midi-studio/ui
          persist-credentials: false

      - name: Checkout LVGL
        uses: actions/checkout@v6
        with:
          repository: lvgl/lvgl
          ref: ${{ env.LVGL_SHA }}
          path: workspace/deps/lvgl
          persist-credentials: false

      - name: Checkout emsdk
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSDK_SHA }}
          path: workspace/deps/emsdk
          persist-credentials: false

      - name: Install pinned Emscripten
        shell: bash
        run: |
          set -euo pipefail
          workspace/deps/emsdk/emsdk install "$EMSDK_VERSION"
          workspace/deps/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build SDL WASM
        shell: bash
        run: |
          set -euo pipefail
          source workspace/deps/emsdk/emsdk_env.sh
          emcmake cmake \
            -S workspace/midi-studio/core/sdl \
            -B workspace/.build/core-sdl-wasm \
            -G Ninja \
            -DAPP_PATH="${GITHUB_WORKSPACE}/workspace/midi-studio/core/sdl" \
            -DBIN_OUTPUT_DIR="${GITHUB_WORKSPACE}/workspace/bin" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_CONTROL_FRAMEWORK_DIR="${GITHUB_WORKSPACE}/workspace/open-control/framework" \
            -DOPEN_CONTROL_UI_LVGL_DIR="${GITHUB_WORKSPACE}/workspace/open-control/ui-lvgl" \
            -DOPEN_CONTROL_UI_COMPONENTS_DIR="${GITHUB_WORKSPACE}/workspace/open-control/ui-lvgl-components" \
            -DOPEN_CONTROL_HAL_SDL_DIR="${GITHUB_WORKSPACE}/workspace/open-control/hal-sdl" \
            -DOPEN_CONTROL_HAL_NET_DIR="${GITHUB_WORKSPACE}/workspace/open-control/hal-net" \
            -DOPEN_CONTROL_HAL_MIDI_DIR="${GITHUB_WORKSPACE}/workspace/open-control/hal-midi" \
            -DOPEN_CONTROL_NOTE_DIR="${GITHUB_WORKSPACE}/workspace/open-control/note" \
            -DMIDI_STUDIO_UI_DIR="${GITHUB_WORKSPACE}/workspace/midi-studio/ui" \
            -DMS_DEVICE_SUPPORT_DIR="${GITHUB_WORKSPACE}/workspace/midi-studio/device-support" \
            -DLVGL_DIR="${GITHUB_WORKSPACE}/workspace/deps/lvgl"
          cmake --build workspace/.build/core-sdl-wasm --parallel
          test -s workspace/bin/core/wasm/midi_studio_core.html
          test -s workspace/bin/core/wasm/midi_studio_core.js
          test -s workspace/bin/core/wasm/midi_studio_core.wasm

      - name: Upload linked WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: midi-studio-core-wasm
          path: workspace/bin/core/wasm/
          retention-days: 7

  unit_tests:
    name: unit tests
    if: ${{ always() }}
    needs: [native_tests, sdl_native, sdl_wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require native qualification
        shell: bash
        env:
          NATIVE_TESTS_RESULT: ${{ needs.native_tests.result }}
          SDL_NATIVE_RESULT: ${{ needs.sdl_native.result }}
          SDL_WASM_RESULT: ${{ needs.sdl_wasm.result }}
        run: |
          set -euo pipefail
          test "$NATIVE_TESTS_RESULT" = "success"
          test "$SDL_NATIVE_RESULT" = "success"
          test "$SDL_WASM_RESULT" = "success"
